# Publica uma versão BETA — canal separado do estável (release.yml).
#
# Isolado de propósito num workflow próprio, em vez de um "if beta" dentro
# do release.yml: assim um bug aqui não tem como quebrar o pipeline
# estável que os usuários já instalados dependem. Só roda quando alguém
# manda rodar (workflow_dispatch) — nunca sozinho a cada push, pra nunca
# surpreender ninguém com uma beta no ar sem querer.
#
# Segurança em duas camadas pra ninguém no canal estável receber isto sem
# pedir (ver UpdateService.cs):
#   1. A Release do GitHub é criada como --prerelease. O UpdateManager
#      padrão (GithubSource com prerelease=false) nem enxerga pré-lançamentos.
#   2. vpk pack --channel beta gera releases.beta.json, separado do
#      releases.win.json que o canal estável lê. Só quem ativou "Receber
#      atualizações beta" nas Configurações (ExplicitChannel="beta") olha
#      esse arquivo.
name: Release Beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou tag a empacotar (padrão: a branch atual)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-beta
  cancel-in-progress: false

jobs:
  release-beta:
    runs-on: windows-latest
    env:
      VPK_VERSION: 1.2.161
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      - name: Descobrir versão beta
        id: ver
        shell: bash
        run: |
          BASE="$(tr -d ' \r\n' < VERSION)"
          VERSION="${BASE}-beta.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão beta: $VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publicar (self-contained win-x64)
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Preparar módulo PawnIO oficial (hash fixo)
        shell: pwsh
        run: ./scripts/Prepare-PawnIO.ps1 -OutputDirectory "publish/Tools"

      - name: Copiar InstallTask.ps1 para o pacote
        run: Copy-Item "InstallTask.ps1" -Destination "publish/InstallTask.ps1"

      - name: Preparar FFmpeg oficial (versão fixada, hash e licença)
        shell: pwsh
        run: ./scripts/Prepare-FFmpeg.ps1 -OutputDirectory "publish/Tools"

      - name: Conferir que nenhum segredo entrou no pacote
        shell: bash
        run: |
          if find publish \( -iname '*api-key*' -o -iname 'settings.json' -o -iname '*.pfx' \) | grep -q .; then
            echo "Arquivo potencialmente sensível encontrado no pacote."
            exit 1
          fi
          test -f publish/HandheldLauncher.exe
          test -f publish/InstallTask.ps1
          test -f publish/Tools/ffmpeg.exe

      - name: Instalar vpk (Velopack)
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Baixar versões beta anteriores (pra delta)
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel beta

      - name: Empacotar (Windows Velopack, canal beta)
        shell: pwsh
        run: |
          $packArgs = @(
            "pack",
            "--channel", "beta",
            "--packId", "HandheldLauncher",
            "--packTitle", "Handheld Launcher (Beta)",
            "--packVersion", "${{ steps.ver.outputs.version }}",
            "--packDir", "publish",
            "--mainExe", "HandheldLauncher.exe",
            "--icon", "src/HandheldLauncher.App/Assets/app-icon.ico",
            "--splashProgressColor", "#7C5CFC"
          )
          Write-Host "Executando: vpk $($packArgs -join ' ')"
          & vpk @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Velopack falhou ao empacotar o instalador beta (exit code $LASTEXITCODE)."
          }

      - name: Publicar Release (marcada como pré-lançamento)
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          gh release view $tag -R $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Handheld Launcher ${{ steps.ver.outputs.version }} (Beta)" --notes "Build de teste — canal beta. Pode ter bugs que ainda não existem na versão estável." --prerelease
          }

          # Mesmo --channel do pack acima: o Velopack só sobe/lê
          # releases.beta.json, nunca toca no feed do canal estável.
          vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --channel beta --tag $tag --releaseName "Handheld Launcher ${{ steps.ver.outputs.version }} (Beta)" --outputDir Releases --merge --publish
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar os artefatos Velopack (beta)." }

      - name: Limpar betas antigas (mantém as 3 mais recentes)
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[] | select(.tag_name | test("-beta\\.")) | .tag_name' > beta_tags.txt
          n=0
          while read -r t; do
            [ -z "$t" ] && continue
            n=$((n+1))
            if [ "$n" -gt 3 ]; then
              gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
            fi
          done < beta_tags.txt
