# Compila a solução a cada envio pro GitHub. Também gera um pacote portátil
# de teste para PRs e branches de desenvolvimento, sem criar Release nem atualizar instalações existentes.
name: Build

on:
  push:
    branches: [master, main, 'design/**', 'feature/**', 'recovery/**', 'beta/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar pacotes
        run: dotnet restore HandheldLauncher.sln

      - name: Compilar
        run: dotnet build HandheldLauncher.sln -c Release --no-restore

      - name: Testes (HandheldLauncher.Core.Tests)
        run: dotnet test src/HandheldLauncher.Core.Tests -c Release --no-build --verbosity normal

      # Versão do pacote de teste = o que está em VERSION + "-preview", pra
      # nunca ficar presa a uma versão antiga (mesma fonte que release.yml usa).
      - name: Descobrir versão de teste
        id: ver
        shell: bash
        run: echo "version=$(tr -d ' \r\n' < VERSION)-preview" >> "$GITHUB_OUTPUT"

      # Pacote independente para testar a interface no handheld.
      # Não usa Velopack e não publica uma versão oficial.
      - name: Publicar pacote portátil de teste (win-x64)
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -f net8.0-windows10.0.19041.0 -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o preview-publish

      - name: Preparar FFmpeg (binário fixo e verificado por SHA-256)
        shell: pwsh
        run: ./scripts/Prepare-FFmpeg.ps1 -OutputDirectory "preview-publish/Tools"

      - name: Preparar módulo PawnIO oficial (hash fixo)
        shell: pwsh
        run: ./scripts/Prepare-PawnIO.ps1 -OutputDirectory "preview-publish/Tools"

      - name: Compactar pacote de teste
        shell: pwsh
        run: Compress-Archive -Path preview-publish/* -DestinationPath HandheldLauncher-preview-win-x64.zip -Force

      - name: Disponibilizar download do pacote de teste
        uses: actions/upload-artifact@v4
        with:
          name: HandheldLauncher-preview-win-x64
          path: HandheldLauncher-preview-win-x64.zip
          if-no-files-found: error
          retention-days: 14

  # Gate de compilação Linux: garante que o código continua a compilar para
  # net8.0 (a TFM que o release.yml publica como linux-x64) a cada envio. O
  # job Windows acima já cobre o build da TFM net8.0-windows; este é o "robô"
  # que avisa na hora se uma chamada Windows-only aparecer no lugar errado.
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar (net8.0 — Linux/macOS)
        run: dotnet build src/HandheldLauncher.App -c Release -f net8.0

      - name: Descobrir versão de teste
        id: ver
        shell: bash
        run: echo "version=$(tr -d ' \r\n' < VERSION)-preview" >> "$GITHUB_OUTPUT"

      - name: Ferramentas de empacotamento
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip desktop-file-utils

      # Pacote + teste de fumo do instalador. É este passo que teria apanhado o
      # bug do Zorin na beta.4 (zip sem bit de execução, atalho fora do PATH,
      # nada no menu de aplicações): o scripts/package-linux.sh gera o .tar.gz e
      # o .zip, extrai-os e instala num HOME temporário antes de aprovar.
      - name: Publicar (linux-x64) para empacotar
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -f net8.0 -r linux-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:TreatWarningsAsErrors=false
          -o publish-linux

      - name: Empacotar + testar o instalador Linux
        run: >
          bash scripts/package-linux.sh
          --publish publish-linux
          --version "${{ steps.ver.outputs.version }}"
          --out .

      - name: Disponibilizar pacote Linux de teste
        uses: actions/upload-artifact@v4
        with:
          name: HandheldLauncher-preview-linux-x64
          path: |
            HandheldLauncher-linux-x64.tar.gz
            HandheldLauncher-linux-x64.zip
          if-no-files-found: error
          retention-days: 14

