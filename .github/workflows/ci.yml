# Compila e gera instaladores beta isolados para testar PRs, sem publicar Release nem atualizar instalações existentes.
name: Build

on:
  push:
    branches: [master, main, 'design/**', 'feature/**', 'recovery/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      VPK_VERSION: 1.2.161
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restaurar pacotes
        run: dotnet restore HandheldLauncher.sln

      - name: Compilar
        run: dotnet build HandheldLauncher.sln -c Release --no-restore

      - name: Testes (HandheldLauncher.Core.Tests)
        run: dotnet test src/HandheldLauncher.Core.Tests -c Release --no-build --verbosity normal

      - name: Definir versão beta isolada
        id: ver
        shell: bash
        # A branch de desenvolvimento ainda carrega VERSION=0.20.5.
        # A beta deve ficar acima da estável 0.23.4 para o atualizador
        # não oferecer a release oficial antes do teste no aparelho.
        run: echo "version=0.23.5-preview" >> "$GITHUB_OUTPUT"

      - name: Publicar pacote portátil de teste (win-x64)
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o preview-publish

      - name: Preparar FFmpeg
        shell: pwsh
        run: ./scripts/Prepare-FFmpeg.ps1 -OutputDirectory "preview-publish/Tools"

      - name: Preparar módulo PawnIO oficial
        shell: pwsh
        run: ./scripts/Prepare-PawnIO.ps1 -OutputDirectory "preview-publish/Tools"

      - name: Compactar pacote portátil
        shell: pwsh
        run: Compress-Archive -Path preview-publish/* -DestinationPath HandheldLauncher-preview-win-x64.zip -Force

      # Gera o mesmo instalador Velopack usado nas versões oficiais,
      # mas somente como artefato de CI: não cria Release nem feed de atualização.
      - name: Copiar InstallTask.ps1
        run: Copy-Item "installer/InstallTask.ps1" -Destination "preview-publish/InstallTask.ps1"

      - name: Instalar vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Gerar instalador beta (Velopack)
        shell: pwsh
        run: |
          $notesFile = "release-notes/${{ steps.ver.outputs.version }}.md"
          $packArgs = @(
            "pack",
            "--packId", "HandheldLauncher",
            "--packTitle", "Handheld Launcher",
            "--packVersion", "${{ steps.ver.outputs.version }}",
            "--packDir", "preview-publish",
            "--mainExe", "HandheldLauncher.exe",
            "--icon", "src/HandheldLauncher.App/Assets/app-icon.ico",
            "--splashProgressColor", "#7C5CFC"
          )
          if (Test-Path $notesFile) { $packArgs += @("--releaseNotes", $notesFile) }
          & vpk @packArgs
          if ($LASTEXITCODE -ne 0) { throw "Velopack falhou ao gerar o instalador beta." }

      - name: Disponibilizar pacote portátil
        uses: actions/upload-artifact@v4
        with:
          name: HandheldLauncher-preview-portable-win-x64
          path: HandheldLauncher-preview-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar instalador beta
        uses: actions/upload-artifact@v4
        with:
          name: HandheldLauncher-beta-installer-win-x64
          path: Releases/*
          if-no-files-found: error
          retention-days: 14
