# Publica uma nova versão do launcher — 100% automático.
#
# Como lançar uma versão: mude o número no arquivo VERSION (raiz do repo,
# ex: 0.3.1 -> 0.3.2) e envie pro GitHub. Este workflow então:
#   1. apaga Releases quebradas (sem nenhum arquivo anexado);
#   2. compila, empacota com o Velopack (Windows) e gera o ZIP portátil (Linux);
#   3. cria a tag vX.Y.Z + a Release e anexa:
#      - HandheldLauncher-win-Setup.exe  (instalador Windows)
#      - os pacotes de atualização delta do Velopack
#      - HandheldLauncher-linux-x64.zip  (pacote portátil Linux)
#      - Modo-Console.zip (scripts opcionais)
# Se a versão do VERSION já tiver uma Release completa, não faz nada.
name: Release

on:
  push:
    branches: [master]
    paths: ['VERSION']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VPK_VERSION: 1.2.161 # tem que ser igual ao pacote Velopack do HandheldLauncher.App.csproj
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir versão
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \r\n' < VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Apagar Releases quebradas (sem arquivos)
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select((.assets | length) == 0) | .tag_name' > broken.txt || true
          while read -r t; do
            [ -z "$t" ] && continue
            echo "Apagando Release vazia: $t"
            gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          done < broken.txt

      - name: Já existe Release completa dessa versão?
        id: exists
        shell: bash
        run: |
          N=$(gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${N:-0}" -gt 0 ]; then
            echo "Release ${{ steps.ver.outputs.tag }} já existe com $N arquivos — nada a fazer."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          dotnet-version: 8.0.x

      # --- BUILD WINDOWS ---
      - name: Publicar (self-contained win-x64)
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Conferir que nenhum segredo entrou no pacote (Windows)
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          if find publish \( -iname '*api-key*' -o -iname 'settings.json' -o -iname '*.pfx' \) | grep -q .; then
            echo "ERRO: arquivo sensível dentro de publish/ — abortando."
            exit 1
          fi

      - name: Instalar vpk (Velopack)
        if: steps.exists.outputs.skip != 'true'
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Baixar versões anteriores (pra delta)
        if: steps.exists.outputs.skip != 'true'
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar (Windows Velopack)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $notesFile = "release-notes/${{ steps.ver.outputs.version }}.md"
          $extra = (Test-Path $notesFile) ? @("--releaseNotes", $notesFile) : @()
          vpk pack `
            --packId HandheldLauncher `
            --packTitle "Handheld Launcher" `
            --packVersion ${{ steps.ver.outputs.version }} `
            --packDir publish `
            --mainExe HandheldLauncher.exe `
            --icon src/HandheldLauncher.App/Assets/app-icon.ico `
            --splashProgressColor "#7C5CFC" `
            @extra
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # --- BUILD LINUX ---
      - name: Publicar (self-contained linux-x64)
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -r linux-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-linux

      - name: Compactar pacote Linux
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path publish-linux/* -DestinationPath HandheldLauncher-linux-x64.zip -Force

      # --- CONSOLE MODE & RELEASE ---
      - name: Montar Modo-Console.zip
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/Modo-Console/Arquivos -Force | Out-Null
          Copy-Item installer/Configurar-Modo-Console.bat stage/Modo-Console/
          Copy-Item installer/Desinstalar.bat stage/Modo-Console/
          Copy-Item installer/Arquivos/Configurar-Modo-Console.ps1 stage/Modo-Console/Arquivos/
          Copy-Item installer/Arquivos/Uninstall-Launcher.ps1 stage/Modo-Console/Arquivos/
          Compress-Archive -Path stage/Modo-Console -DestinationPath Modo-Console.zip -Force

      - name: Publicar Release
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          Get-ChildItem Releases | Format-Table Name, Length
          gh release view $tag -R $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $notesFile = "release-notes/${{ steps.ver.outputs.version }}.md"
            if (Test-Path $notesFile) {
              gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Handheld Launcher ${{ steps.ver.outputs.version }}" --notes-file $notesFile
            } else {
              gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Handheld Launcher ${{ steps.ver.outputs.version }}" --notes "Handheld Launcher ${{ steps.ver.outputs.version }}"
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          
          # Anexa os pacotes do Velopack (Windows) + Modo Console + Pacote Linux
          $files = @(Get-ChildItem Releases -File | ForEach-Object { $_.FullName }) + @((Resolve-Path Modo-Console.zip).Path) + @((Resolve-Path HandheldLauncher-linux-x64.zip).Path)
          
          gh release upload $tag @files -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Limpar versões antigas
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'sort_by(.created_at) | reverse | .[].tag_name' > tags.txt
          n=0
          while read -r t; do
            [ -z "$t" ] && continue
            n=$((n+1))
            if [ "$n" -gt 3 ]; then
              echo "Apagando versão antiga: $t"
              gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
            elif [ -f "release-notes/${t#v}.md" ]; then
              gh release edit "$t" --notes-file "release-notes/${t#v}.md" -R "$GITHUB_REPOSITORY" || true
            fi
          done < tags.txt