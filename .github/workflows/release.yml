# Publica uma nova versão do launcher — 100% automático.
name: Release

on:
  push:
    branches: [master]
    paths: ['VERSION']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VPK_VERSION: 1.2.161
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir versão
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \r\n' < VERSION)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Apagar Releases quebradas (sem arquivos)
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select((.assets | length) == 0) | .tag_name' > broken.txt || true
          while read -r t; do
            [ -z "$t" ] && continue
            echo "Apagando Release vazia: $t"
            gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          done < broken.txt

      - name: Já existe Release completa dessa versão?
        id: exists
        shell: bash
        run: |
          N=$(gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${N:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          dotnet-version: 8.0.x

      - name: Publicar (self-contained win-x64)
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish

      - name: Copiar InstallTask.ps1 para o pacote
        if: steps.exists.outputs.skip != 'true'
        run: Copy-Item "InstallTask.ps1" -Destination "publish/InstallTask.ps1"

      - name: Baixar e empacotar FFmpeg
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
          $exe = Get-ChildItem -Path "ffmpeg_temp" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "FFmpeg não foi encontrado no pacote baixado." }
          New-Item -ItemType Directory -Path "publish/Tools" -Force | Out-Null
          Copy-Item $exe.FullName -Destination "publish/Tools/ffmpeg.exe" -Force
          Remove-Item "ffmpeg.zip" -Force
          Remove-Item "ffmpeg_temp" -Recurse -Force

      - name: Conferir que nenhum segredo entrou no pacote
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          if find publish \( -iname '*api-key*' -o -iname 'settings.json' -o -iname '*.pfx' \) | grep -q .; then
            echo "Arquivo potencialmente sensível encontrado no pacote."
            exit 1
          fi
          test -f publish/HandheldLauncher.exe
          test -f publish/InstallTask.ps1
          test -f publish/Tools/ffmpeg.exe

      - name: Assinar binários Windows (quando o certificado estiver configurado)
        if: steps.exists.outputs.skip != 'true' && env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD) {
            throw "O segredo WINDOWS_SIGNING_CERTIFICATE_PASSWORD não foi configurado."
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "handheld-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert -or -not $cert.HasPrivateKey) { throw "O PFX não contém um certificado com chave privada." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "SignTool.exe não foi encontrado no runner." }
          $binaries = Get-ChildItem publish -Recurse -File | Where-Object { $_.Extension -in @(".exe", ".dll") }
          foreach ($file in $binaries) {
            & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar $($file.FullName)." }
          }
          Remove-Item $pfxPath -Force

      - name: Avisar quando a assinatura não estiver configurada
        if: steps.exists.outputs.skip != 'true' && env.WINDOWS_SIGNING_CERTIFICATE_BASE64 == ''
        shell: pwsh
        run: Write-Warning "Publicação sem assinatura Authenticode. O Smart App Control pode bloquear o instalador. Configure os segredos WINDOWS_SIGNING_CERTIFICATE_BASE64 e WINDOWS_SIGNING_CERTIFICATE_PASSWORD."

      - name: Instalar vpk (Velopack)
        if: steps.exists.outputs.skip != 'true'
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Baixar versões anteriores (pra delta)
        if: steps.exists.outputs.skip != 'true'
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar (Windows Velopack)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $notesFile = "release-notes/${{ steps.ver.outputs.version }}.md"
          $packArgs = @(
            "pack",
            "--packId", "HandheldLauncher",
            "--packTitle", "Handheld Launcher",
            "--packVersion", "${{ steps.ver.outputs.version }}",
            "--packDir", "publish",
            "--mainExe", "HandheldLauncher.exe",
            "--icon", "src/HandheldLauncher.App/Assets/app-icon.ico",
            "--splashProgressColor", "#7C5CFC"
          )
          if (Test-Path $notesFile) {
            $packArgs += @("--releaseNotes", $notesFile)
          }

          Write-Host "Executando: vpk $($packArgs -join ' ')"
          & vpk @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Velopack falhou ao empacotar o instalador (exit code $LASTEXITCODE)."
          }

      - name: Assinar instalador Velopack
        if: steps.exists.outputs.skip != 'true' && env.WINDOWS_SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "handheld-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $cert -or -not $cert.HasPrivateKey) { throw "O PFX não contém um certificado com chave privada." }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match "\\x64\\signtool.exe$" } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "SignTool.exe não foi encontrado." }
          Get-ChildItem Releases -Filter "*Setup.exe" -File | ForEach-Object {
            & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Falha ao assinar o instalador $($_.Name)." }
            & $signtool.FullName verify /pa /v $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "A verificação da assinatura falhou: $($_.Name)." }
          }
          Remove-Item $pfxPath -Force

      - name: Publicar (self-contained linux-x64)
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -r linux-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish-linux

      - name: Compactar pacote Linux
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path publish-linux/* -DestinationPath HandheldLauncher-linux-x64.zip -Force

      - name: Montar Modo-Console.zip
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/Modo-Console/Arquivos -Force | Out-Null
          Copy-Item installer/Configurar-Modo-Console.bat stage/Modo-Console/
          Copy-Item installer/Desinstalar.bat stage/Modo-Console/
          Copy-Item installer/Arquivos/Configurar-Modo-Console.ps1 stage/Modo-Console/Arquivos/
          Copy-Item installer/Arquivos/Uninstall-Launcher.ps1 stage/Modo-Console/Arquivos/
          Compress-Archive -Path stage/Modo-Console -DestinationPath Modo-Console.zip -Force

      # A tag v0.13.5 existia apontando para um commit de uma tentativa quebrada.
      # Reposiciona a tag para exatamente o commit que acabou de ser empacotado.
      # A tag v0.13.6 também foi uma tentativa sem Release funcional e é removida.
      - name: Corrigir tags das versões com publicação quebrada
        if: steps.exists.outputs.skip != 'true' && steps.ver.outputs.tag == 'v0.13.5'
        shell: bash
        run: |
          git push --force origin "$GITHUB_SHA:refs/tags/v0.13.5"
          git push origin :refs/tags/v0.13.6

      - name: Retirar a 0.13.5 da lista de versões públicas
        if: steps.ver.outputs.version == '0.13.6'
        shell: bash
        run: |
          # Mantém os arquivos históricos, mas tira a release problemática
          # da página pública de downloads enquanto a correção é validada.
          gh release edit v0.13.5 --draft -R "$GITHUB_REPOSITORY" || true

      - name: Publicar Release
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          gh release view $tag -R $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $notesFile = "release-notes/${{ steps.ver.outputs.version }}.md"
            if (Test-Path $notesFile) {
              gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Handheld Launcher ${{ steps.ver.outputs.version }}" --notes-file $notesFile
            } else {
              gh release create $tag -R $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Handheld Launcher ${{ steps.ver.outputs.version }}" --notes "Handheld Launcher ${{ steps.ver.outputs.version }}"
            }
          }

          $files = @(Get-ChildItem Releases -File | ForEach-Object { $_.FullName }) + @((Resolve-Path Modo-Console.zip).Path) + @((Resolve-Path HandheldLauncher-linux-x64.zip).Path)
          gh release upload $tag @files -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar os arquivos da Release." }

      - name: Limpar versões antigas
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'sort_by(.created_at) | reverse | .[].tag_name' > tags.txt
          n=0
          while read -r t; do
            [ -z "$t" ] && continue
            n=$((n+1))
            if [ "$n" -gt 3 ]; then
              gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
            elif [ -f "release-notes/${t#v}.md" ]; then
              gh release edit "$t" --notes-file "release-notes/${t#v}.md" -R "$GITHUB_REPOSITORY" || true
            fi
          done < tags.txt
