# Publica uma nova versão do launcher — 100% automático.
name: Release

on:
  push:
    branches: [master]
    paths: ['VERSION']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      VPK_VERSION: 1.2.161
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descobrir versão
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(tr -d ' \r\n' < VERSION)"
          fi
          BASE_VERSION="${VERSION%%-*}"
          IS_PRERELEASE="false"
          if [[ "$VERSION" == *"-"* ]]; then IS_PRERELEASE="true"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION (base: $BASE_VERSION, prerelease: $IS_PRERELEASE)"

      - name: Apagar Releases quebradas (sem arquivos)
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select((.assets | length) == 0) | .tag_name' > broken.txt || true
          while read -r t; do
            [ -z "$t" ] && continue
            echo "Apagando Release vazia: $t"
            gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          done < broken.txt

      - name: Já existe Release completa dessa versão?
        id: exists
        shell: bash
        run: |
          N=$(gh release view "${{ steps.ver.outputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "${N:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.exists.outputs.skip != 'true'
        with:
          dotnet-version: 8.0.x

      - name: Publicar (self-contained win-x64)
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -f net8.0-windows10.0.19041.0 -r win-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:TreatWarningsAsErrors=false
          -o publish

      - name: Preparar módulo PawnIO oficial (hash fixo)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/Prepare-PawnIO.ps1 -OutputDirectory "publish/Tools"

      - name: Copiar InstallTask.ps1 para o pacote
        if: steps.exists.outputs.skip != 'true'
        run: Copy-Item "installer/InstallTask.ps1" -Destination "publish/InstallTask.ps1"

      - name: Preparar FFmpeg oficial (versão fixada, hash e licença)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: ./scripts/Prepare-FFmpeg.ps1 -OutputDirectory "publish/Tools"

      - name: Conferir que nenhum segredo entrou no pacote
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          if find publish \( -iname '*api-key*' -o -iname 'settings.json' -o -iname '*.pfx' \) | grep -q .; then
            echo "Arquivo potencialmente sensível encontrado no pacote."
            exit 1
          fi
          test -f publish/HandheldLauncher.exe
          test -f publish/InstallTask.ps1
          test -f publish/Tools/ffmpeg.exe

      - name: Instalar vpk (Velopack)
        if: steps.exists.outputs.skip != 'true'
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Baixar versões anteriores (pra delta)
        if: steps.exists.outputs.skip != 'true'
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar (Windows Velopack)
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $notesFile = "release-notes/${{ steps.ver.outputs.version }}.md"
          $packArgs = @(
            "pack",
            "--packId", "HandheldLauncher",
            "--packTitle", "Handheld Launcher",
            "--packVersion", "${{ steps.ver.outputs.version }}",
            "--packDir", "publish",
            "--mainExe", "HandheldLauncher.exe",
            "--icon", "src/HandheldLauncher.App/Assets/app-icon.ico",
            "--splashProgressColor", "#7C5CFC",
            # v0.25: ecrã de boas-vindas do instalador (Velopack setup wizard) e
            # escolha de pasta. --instLocation já é 'Either' por omissão, fica
            # explícito para ninguém o mudar sem querer.
            "--instWelcome", "installer/InstWelcome.txt",
            "--instLocation", "Either"
          )
          if (Test-Path $notesFile) {
            $packArgs += @("--releaseNotes", $notesFile)
          }

          Write-Host "Executando: vpk $($packArgs -join ' ')"
          & vpk @packArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Velopack falhou ao empacotar o instalador (exit code $LASTEXITCODE)."
          }

      - name: Publicar (self-contained linux-x64)
        if: steps.exists.outputs.skip != 'true'
        run: >
          dotnet publish src/HandheldLauncher.App -c Release -f net8.0 -r linux-x64
          --self-contained true
          -p:Version=${{ steps.ver.outputs.version }}
          -p:TreatWarningsAsErrors=false
          -o publish-linux

      - name: Copiar instalador Linux para o pacote
        if: steps.exists.outputs.skip != 'true'
        run: Copy-Item "installer/install-linux.sh" -Destination "publish-linux/install-linux.sh"

      - name: Compactar pacote Linux
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path publish-linux/* -DestinationPath HandheldLauncher-linux-x64.zip -Force

      - name: Montar Modo-Console.zip
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path stage/Modo-Console/Arquivos -Force | Out-Null
          Copy-Item installer/Configurar-Modo-Console.bat stage/Modo-Console/
          Copy-Item installer/Desinstalar.bat stage/Modo-Console/
          Copy-Item installer/Arquivos/Configurar-Modo-Console.ps1 stage/Modo-Console/Arquivos/
          Copy-Item installer/Arquivos/Uninstall-Launcher.ps1 stage/Modo-Console/Arquivos/
          Compress-Archive -Path stage/Modo-Console -DestinationPath Modo-Console.zip -Force

      # Histórico: a tag v0.13.5 existia apontando para um commit de uma
      # tentativa quebrada. Reposiciona para o commit que acabou de ser
      # empacotado. A tag v0.13.6 também foi uma tentativa sem Release
      # funcional e é removida.
      - name: Corrigir tags das versões com publicação quebrada
        if: steps.exists.outputs.skip != 'true' && steps.ver.outputs.tag == 'v0.13.5'
        shell: bash
        run: |
          git push --force origin "$GITHUB_SHA:refs/tags/v0.13.5"
          git push origin :refs/tags/v0.13.6

      - name: Retirar a 0.13.5 da lista de versões públicas
        if: steps.ver.outputs.version == '0.13.6'
        shell: bash
        run: |
          gh release edit v0.13.5 --draft -R "$GITHUB_REPOSITORY" || true

      - name: Publicar Release
        if: steps.exists.outputs.skip != 'true'
        shell: pwsh
        run: |
          $tag         = "${{ steps.ver.outputs.tag }}"
          $version     = "${{ steps.ver.outputs.version }}"
          $baseVersion = "${{ steps.ver.outputs.base_version }}"
          $isPrerelease = "${{ steps.ver.outputs.is_prerelease }}" -eq "true"

          # Notas: prefere release-notes/{versão}.md; cai pra {base}.md
          # (ex.: v0.20.0-beta.2 → tenta 0.20.0-beta.2.md, usa 0.20.0.md)
          $notesFile = "release-notes/$version.md"
          if (-not (Test-Path $notesFile)) {
            $candidate = "release-notes/$baseVersion.md"
            if (Test-Path $candidate) { $notesFile = $candidate } else { $notesFile = $null }
          }
          if (-not $notesFile) { Write-Warning "Nenhuma nota encontrada para $version / $baseVersion — release sai sem changelog." }

          $title = "Handheld Launcher $version"

          # 1) Criar release se ainda não existe
          gh release view $tag -R $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @("release", "create", $tag,
                            "-R", $env:GITHUB_REPOSITORY,
                            "--target", $env:GITHUB_SHA,
                            "--title", $title)
            if ($notesFile) { $createArgs += @("--notes-file", $notesFile) }
            else            { $createArgs += @("--notes", $title) }
            if ($isPrerelease) { $createArgs += "--prerelease" }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Falha ao criar Release $tag." }
          }

          # 2) Upload Velopack (artefatos do pack atual + feed de update)
          vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}" --token "${{ secrets.GITHUB_TOKEN }}" --tag $tag --releaseName $title --outputDir Releases --merge --publish
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar os artefatos Velopack." }

          # 3) Reforço: garante que beta NÃO fica como "Latest" e estável É "Latest"
          #    (vpk upload pode re-marcar; belt-and-suspenders)
          $editArgs = @("release", "edit", $tag, "-R", $env:GITHUB_REPOSITORY)
          if ($isPrerelease) { $editArgs += "--prerelease" } else { $editArgs += "--latest" }
          if ($notesFile)    { $editArgs += @("--notes-file", $notesFile) }
          & gh @editArgs
          if ($LASTEXITCODE -ne 0) { Write-Warning "gh release edit retornou $LASTEXITCODE (não fatal)." }

          # 4) Complementares (não gerenciados pelo Velopack)
          gh release upload $tag (Resolve-Path Modo-Console.zip).Path (Resolve-Path HandheldLauncher-linux-x64.zip).Path -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Falha ao enviar os arquivos complementares da Release." }

      - name: Limpar versões antigas
        if: steps.exists.outputs.skip != 'true'
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq 'sort_by(.created_at) | reverse | .[].tag_name' > tags.txt
          n=0
          while read -r t; do
            [ -z "$t" ] && continue
            n=$((n+1))
            if [ "$n" -gt 3 ]; then
              gh release delete "$t" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
            elif [ -f "release-notes/${t#v}.md" ]; then
              gh release edit "$t" --notes-file "release-notes/${t#v}.md" -R "$GITHUB_REPOSITORY" || true
            fi
          done < tags.txt